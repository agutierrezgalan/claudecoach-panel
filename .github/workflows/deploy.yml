name: Desplegar panel

# Compila la app Kotlin/Wasm y la publica en GitHub Pages.
# Los datos (cifrados) NO están aquí: la app los lee de la rama `data`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GRADLE_VERSION: "9.8.2"
  # https://gradle.org/release-checksums/ (Binary-only ZIP)
  GRADLE_SHA256: "21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle (verificado por SHA-256)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      # Caché de dependencias: menos descargas (Maven Central limita con 429). Se siguen verificando
      # los hashes de verification-metadata.xml en cada build, con o sin caché.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/nodejs
            ~/.gradle/binaryen
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'kotlin-js-store/**') }}

      - name: Tests y compilación Kotlin/Wasm (dependencias verificadas con verification-metadata.xml)
        run: |
          set -o pipefail   # sin esto, el resultado sería el de `tee` y un fallo pasaría por éxito
          export JAVA_HOME="$JAVA_HOME_21_X64"
          # Si falla un test (contrato con Python, cifrado, estados, presentadores) no se publica nada.
          # Reintenta solo si el fallo es de descarga (429/timeout), nunca si falla un test o la verificación.
          for i in 1 2 3; do
            if "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon wasmJsNodeTest wasmJsBrowserDistribution 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              exit 0
            fi
            grep -qE "status code 429|Read timed out|Connection reset" "$RUNNER_TEMP/build.log" || exit 1
            echo "Límite de descargas: reintento en $((i * 60)) s"
            sleep $((i * 60))
          done
          exit 1
          rm -f build/dist/wasmJs/productionExecutable/*.map
          touch build/dist/wasmJs/productionExecutable/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
